<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Letak Strategis Indonesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#e8eef5;--card:#fff;--tx:#12263a;--mu:#51667a;--pr:#0b6bcb;--pr2:#e3f0fd;--ok:#14854a;--no:#c62828;--bd:#c9d6e3;--hd:#0b3a6b;--hdt:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1219;--card:#16212c;--tx:#e6eef6;--mu:#9bb0c4;--pr:#4aa3ff;--pr2:#17304a;--ok:#4cd68b;--no:#ff7b7b;--bd:#2c3d4e;--hd:#0a2748;--hdt:#fff}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#st{width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;container-type:size;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
header{background:var(--hd);color:var(--hdt);display:flex;align-items:center;gap:1.2cqw;padding:0 2cqw;height:10cqh}
h1{font-size:2cqw;white-space:nowrap}
nav{display:flex;gap:.6cqw;flex:1;justify-content:center}
button{font:inherit;cursor:pointer;border:0;border-radius:.8cqw;transition:.15s}
button:active{transform:scale(.96)}
.tab{background:transparent;color:var(--hdt);padding:.7cqw 1.3cqw;font-size:1.35cqw;opacity:.8}
.tab.on{background:var(--hdt);color:var(--hd);opacity:1;font-weight:700}
.ct{background:rgba(255,255,255,.18);color:var(--hdt);padding:.6cqw 1cqw;font-size:1.2cqw}
.ct:hover{background:rgba(255,255,255,.3)}
main{flex:1;padding:2cqh 2cqw;min-height:0}
.pane{display:none;height:100%;gap:1.6cqw}.pane.on{display:flex}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.2cqw;padding:1.6cqw;font-size:1.5cqw;line-height:1.45}
h2{font-size:2.2cqw;color:var(--pr);margin-bottom:1cqh}
h3{font-size:1.7cqw;margin-bottom:.8cqh}
.mu{color:var(--mu)}
.pb{background:var(--pr);color:#fff;padding:.9cqw 1.8cqw;font-size:1.5cqw;font-weight:600}
.pb:hover{filter:brightness(1.1)}
ul{padding-left:2cqw}li{margin:.5cqh 0}
.tl{display:flex;flex-direction:column;gap:1cqh;width:30cqw}
.tb{background:var(--card);color:var(--tx);border:2px solid var(--bd);text-align:left;padding:1.1cqw 1.4cqw;font-size:1.6cqw}
.tb.on{border-color:var(--pr);background:var(--pr2);font-weight:700}
.tb.v::after{content:" ✓";color:var(--ok)}
.bar{height:1cqh;background:var(--bd);border-radius:1cqh;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:.4s}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);padding:1cqw 1.3cqw;margin:.8cqh 0;font-size:1.5cqw}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
select,textarea,input,[contenteditable]{font:inherit;font-size:1.35cqw;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:.6cqw;padding:.6cqw .8cqw;width:100%}
textarea{resize:none;height:11cqh}
.row{display:flex;gap:1cqw;align-items:center;margin:.7cqh 0}.row span{flex:1}.row select{width:16cqw}
.big{font-size:5cqw;text-align:center}
.f{flex:1;min-width:0;display:flex;flex-direction:column}
.fb{font-weight:700;margin-top:1cqh;min-height:3cqh}
#st{position:relative}
#sp{position:absolute;inset:0;z-index:50;background-size:cover;background-position:center;display:flex;align-items:flex-end;transition:opacity .6s,transform .6s}
#sp.hd{opacity:0;transform:scale(1.05);pointer-events:none}
#sp .pn{width:100%;display:flex;align-items:center;gap:2cqw;padding:2cqh 3cqw;background:linear-gradient(transparent,rgba(5,25,55,.88))}
#sp .ld{flex:1}#pt{color:#fff;font-size:1.4cqw;font-weight:600;margin-bottom:.8cqh;text-shadow:0 1px 3px #000}
#pb2{height:1.4cqh;background:rgba(255,255,255,.3);border-radius:1cqh;overflow:hidden}#pf{height:100%;width:0;background:linear-gradient(90deg,#ffc928,#e53935);transition:width .12s}
#sb{background:#e53935;color:#fff;font-size:1.9cqw;font-weight:800;padding:.9cqw 3cqw;border-radius:5cqw;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.4)}
#sb:disabled{background:#6b7b8c;cursor:wait}#sb.rd{animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.08)}}
#lb{position:absolute;top:10cqh;left:0;height:.5cqh;background:#ffc928;width:0;z-index:5}
#lb.g{animation:lg .5s ease-out}@keyframes lg{from{width:0;opacity:1}80%{width:100%;opacity:1}to{width:100%;opacity:0}}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
let on=true,A;
function tone(f,d,t='sine',v=.15,s=0){if(!on)return;try{A=A||new(window.AudioContext||window.webkitAudioContext)();if(A.state=='suspended')A.resume();const o=A.createOscillator(),g=A.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(A.destination);const T=A.currentTime+s;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.start(T);o.stop(T+d)}catch(e){}}
const S={click:()=>tone(520,.08,'triangle'),ok:()=>{tone(660,.12);tone(880,.2,'sine',.15,.12)},no:()=>tone(160,.3,'sawtooth',.1),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',.15,i*.13)),rs:()=>{tone(400,.1);tone(300,.15,'sine',.15,.1)}};
const tabs=['Tujuan','Teori','Kuis','LKPD Kelompok','Pengembang'];
$('#nav').innerHTML=tabs.map((t,i)=>`<button class="tab" data-i="${i}">${t}</button>`).join('');
function go(i){S.click();document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',i==j));document.querySelectorAll('.pane').forEach((p,j)=>p.classList.toggle('on',i==j));cur=i;lbr()}
let cur=0;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(+b.dataset.i));
$('#snd').onclick=e=>{on=!on;e.target.textContent=on?'🔊':'🔇';S.click()};

// TUJUAN
$('#p0').innerHTML=`<div class="card f" style="flex:1.3"><h2>🎯 Tujuan Pembelajaran</h2><p class="mu">Geografi · Fase F (Kelas XI–XII)</p><ul id="tj" style="margin-top:1.5cqh"></ul><button class="pb" style="margin-top:auto;align-self:flex-start" id="go1">Mulai Belajar ▶</button></div>
<div class="card f" style="flex:.8;align-items:center;justify-content:center;text-align:center"><div class="big">🧭</div><h3>Indonesia di Silang Dunia</h3><p class="mu">Dua benua · Dua samudra · Tiga lempeng</p><button class="pb" id="fun" style="margin-top:2cqh">Klik: Fakta Unik!</button><p id="fk" class="fb" style="min-height:8cqh"></p></div>`;
const tj=['Menjelaskan letak astronomis, geografis, geologis, dan ekonomis Indonesia.','Menganalisis pengaruh letak strategis terhadap iklim, kondisi alam, dan perekonomian.','Mengevaluasi peluang dan tantangan letak strategis bagi pembangunan nasional.','Berkolaborasi dalam kelompok untuk memecahkan masalah melalui LKPD.'];
$('#tj').innerHTML=tj.map(t=>`<li>${t}</li>`).join('');
$('#go1').onclick=()=>go(1);
const fak=['Indonesia memiliki sekitar 17 ribu pulau dan membentang lebih dari 5.000 km dari barat ke timur.','Selat Malaka dilalui sekitar seperempat perdagangan laut dunia.','Indonesia dilalui garis khatulistiwa (0°) di Sumatra, Kalimantan, dan Sulawesi.','Indonesia memiliki lebih dari 100 gunung api aktif.'];

// TEORI
const T=[['📍','Letak Astronomis','Berdasarkan garis lintang dan bujur: sekitar 6°LU–11°LS dan 95°BT–141°BT.','Dampak: beriklim tropis (suhu tinggi, curah hujan tinggi), hanya dua musim, hutan hujan tropis, perbedaan waktu WIB–WITA–WIT.'],
['🗺️','Letak Geografis','Di antara Benua Asia dan Australia serta Samudra Hindia dan Pasifik.','Dampak: dipengaruhi angin muson (barat dan timur), jalur lalu lintas dunia, dan keragaman budaya akibat interaksi antarbangsa.'],
['🌋','Letak Geologis','Pertemuan Lempeng Eurasia, Indo-Australia, dan Pasifik; dilalui Sirkum Pasifik dan Sirkum Mediterania.','Dampak: tanah vulkanik subur, kaya tambang, tetapi rawan gempa bumi, tsunami, dan erupsi.'],
['🚢','Letak Ekonomis','Dilalui jalur pelayaran Selat Malaka, Sunda, Lombok, dan ALKI I, II, III.','Dampak: peluang perdagangan, pelabuhan, dan pariwisata; tantangan keamanan maritim dan persaingan global.'],
['🤝','Letak Sosial Budaya','Berada di persimpangan budaya India, Tiongkok, Arab, dan Eropa.','Dampak: masyarakat majemuk, tradisi beragam; perlu toleransi dan Bhinneka Tunggal Ika.']];
let vis=new Set;
